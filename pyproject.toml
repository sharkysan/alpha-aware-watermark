[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-aware-watermark-remover"
version = "1.3.0"
description = "Alpha-aware temporal watermark removal pipeline"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2.3",
  "opencv-python>=4.8,<6"
]

[project.optional-dependencies]
ui = [
  "gradio>=6.22,<7"
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "bandit>=1.7.9",
  "pip-audit>=2.7",
  "build>=1.2",
  "twine>=5"
]

[project.scripts]
watermark-remove = "watermark_remover.cli:main"
watermark-remove-ui = "watermark_remover.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["watermark_remover"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"watermark_remover/ui.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
follow_imports = "skip"
